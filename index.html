<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="gsap.css" />

    <title>GSAP</title>
  </head>

  <body>
    <button id="menu-btn" class="menu-btn">☰</button>

    <div id="menu" class="menu">
      <h2>Ejemplos</h2>

      <button id="opcion-tuberia">💧 Tubería de agua</button>

      <button id="opcion-arrastrar">↔ Arrastrar y soltar</button>
    </div>

    <main>
      <section id="tuberia">
        <svg width="600" height="300" viewBox="0 0 600 300">
          <defs>
            <mask id="mascaraAgua">
              <rect width="600" height="300" fill="black"></rect>

              <path
                class="agua-mascara"
                d="M50 100 H350 V200 H550"
                fill="none"
                stroke="white"
                stroke-width="30"
                stroke-linecap="round"
                stroke-dasharray="600"
                stroke-dashoffset="600"
              ></path>
            </mask>
          </defs>

          <path
            class="tuberia"
            d="M50 100 H350 V200 H550"
            fill="none"
            stroke="#333"
            stroke-width="50"
          ></path>

          <path
            class="agua"
            d="M50 100 H350 V200 H550"
            fill="none"
            stroke="#0833A2"
            stroke-width="30"
            stroke-linecap="round"
          ></path>

          <path
            class="flujo"
            d="M50 100 H350 V200 H550"
            fill="none"
            stroke="#4da6ff"
            stroke-width="8"
            stroke-linecap="round"
            stroke-dasharray="10 15"
            mask="url(#mascaraAgua)"
          ></path>
        </svg>

        <div class="controles">
          <button id="atras">&lt;</button>
          <button id="adelante">&gt;</button>
        </div>
      </section>

      <section id="arrastrar">
        <h1>Arrastrar y soltar</h1>

        <div class="zona-arrastrar">

            <div class="figuras">
                <div id="objeto"></div>
                <div id="triangulo"></div>
            </div>
        
            <div class="destinos">
        
                <div id="destino"></div>
        
                <svg id="destino-triangulo" width="140" height="130" viewBox="0 0 140 130">
                    <polygon
                        points="70,10 10,120 130,120"
                        fill="none"
                        stroke="#014753"
                        stroke-width="3"
                        stroke-dasharray="8 6">
                    </polygon>
                </svg>
        
            </div>
        
        </div>
        
        <button id="reiniciar">Reiniciar</button>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/MotionPathPlugin.min.js"></script>

    <script src="gsap.js"></script>
  </body>
</html>
